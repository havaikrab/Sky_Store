{% extends 'base.html' %}

{% block title %} Авторизация {% endblock %}

{% block header %}
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h6 class="display-6">Добро пожаловать в Sky Store</h6>
    </div>
{% endblock %}

{% block content %}
    <div class="d-flex justify-content-end">
        <div class="card mb-4 box-shadow" style="width: 300px">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">Авторизация</h4>
            </div>
            <div class="card-body text-start">
                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                            <p style="color: red">Введите корректный адрес электронной почты и пароль</p>
                    {% endif %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Адрес электронной почты</label>
                        <input type="email" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="p-2 btn btn-outline-primary">Войти</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
