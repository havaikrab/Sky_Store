{% extends 'base.html' %}

{% block title %} {{object.title}} {% endblock %}

{% block header %}
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h6 class="display-3">{{object.title}}</h6>
    </div>
{% endblock %}

{% block content %}
    <div>
        <ul class="list-unstyled mt-3 mb-4 text-start m-3 text-center">
            <li>
                {% if object.preview %}
                    <img src=" {{object.preview.url}} " alt="{{ object.title }}" style="height: 500px">
                {% endif %}
            </li>
            <li>{{object.content}}</li>
        </ul>
        <a class="btn btn-primary" href="{% url 'sky_blog:update_article' object.pk %}" role="button">Редакторовать</a>
        <a class="btn btn-primary" href="{% url 'sky_blog:delete_article' object.pk %}" role="button">Удалить</a>
    </div>
{% endblock %}
