[project]
name = "sky-store"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "django-crispy-forms (>=2.6,<3.0)",
    "crispy-bootstrap5 (>=2026.3,<2027.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.20.0,<2.0.0)"
]
dev = [
    "ipython (>=9.12.0,<10.0.0)"
]

[tool.isort]
line_length = 119
lines_after_imports = 2

[tool.black]
line-length = 119
exclude = '''
/(
\.venv|
\.git|
\.mypy_cache|
\.pytest_cache|
build|
dist
venv
)/
'''

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude_gitignore = true
