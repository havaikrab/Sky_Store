<div>
    {% if user.is_authenticated %}
        {% if greeting %}
            <h1 class="pricing-header mb-5 text-center display-4">Ознакомьтесь с последними новинками {{user.username}}</h1>
        {% else %}
            <h4 class="ps-5 pb-5 pt-3">Список продуктов, требующих одобрения публикации</h4>
        {% endif %}
    {% else %}
        <div class="pricing-header mb-5 text-center">
            <h1 class="display-4">Skystore</h1>
            <p class="lead">Skystore - это отличное место, чтобы купить или продать лучший продукт</p>
        </div>
    {% endif %}
</div>
