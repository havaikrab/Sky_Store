{% extends 'catalog/base.html' %}

{% block title %} Создать категорию {% endblock %}

{% block header %}
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h6 class="display-6">Здесь можно описать новую категорию продуктов</h6>
    </div>
{% endblock %}

{% block content %}
    <div class="col-lg-3 col-md-6 col-sm-12">
        <div class="card mb-4 box-shadow" style="width: 500px">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">Новая категория</h4>
            </div>
            <div class="card-body">
                <form method="post" action="" class="form-floating">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name">Название категории</label>
                        <input type="text" name="name" class="form-control" id="name" placeholder="Ввведите название" required>
                    </div>
                    <div class="mb-3">
                        <label for="description">Описание</label>
                        <textarea name="description" class="form-control" id="description" placeholder="Опишите новую категорию" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Создать</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
