{% extends 'base.html' %}

{% block title %} Подтверждение удаления {% endblock %}

{% block header %}
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h6 class="display-6">Действительно ли вы хотите удалить продукт</h6>
        <h4 class="display-3">{{object.name}}</h4>
    </div>
{% endblock %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-danger" style="width: 300px">Удалить</button>
        <a class="btn btn-outline-primary" style="width: 300px" href="{% url 'catalog:product' pk=object.pk %}" role="button">Отмена</a>
    </form>
{% endblock %}
